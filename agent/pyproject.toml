[project]
name = "contentflow-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
