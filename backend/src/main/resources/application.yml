server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/contentflow}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

contentflow:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
  agent:
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
    connect-timeout-millis: ${AGENT_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${AGENT_READ_TIMEOUT_MILLIS:240000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    bucket: ${MINIO_BUCKET:contentflow}

logging:
  file:
    name: ${LOG_FILE:logs/contentflow.log}
